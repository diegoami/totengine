name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (release smoke)
        run: cargo build --workspace --release

  python-tools:
    name: Python probe toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python3 -m py_compile tools/totctl.py
      # Golden-file tests over the local corpus run only where the game is
      # installed (T0-9 will wire CIVTOT_HOME-aware skips into the same suite).
