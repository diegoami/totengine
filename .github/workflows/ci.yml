name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (release smoke)
        run: cargo build --workspace --release

  python-tools:
    name: Python probe toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python3 -m py_compile tools/totctl.py tools/worldgen_compare.py tools/worldgen_capture_manifest.py tools/oracle/dialog_guard.py
      - name: World generation evidence checks
        run: python3 -m unittest discover -s tools -p 'test_worldgen_compare.py'
      - name: Local artwork preview routing
        run: python3 -m unittest discover -s tools -p 'test_preview_client.py'
      - name: Golden corpus (self-skips without CIVTOT_HOME)
        run: bash tools/golden.sh check
      # Golden-file tests over the local corpus run only where the game is
      # installed (T0-9 will wire CIVTOT_HOME-aware skips into the same suite).
