[workspace]
resolver = "2"
members = [
    "crates/tot-kit",
    "crates/engine",
    "crates/lua-host",
    "crates/totctl",
    "crates/totui",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/diegoami/totengine"

[workspace.lints.rust]
unsafe_code = "forbid"
