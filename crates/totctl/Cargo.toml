[package]
name = "totctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for ToTEngine: inspect ToT game data (successor of the Python probe)"

[[bin]]
name = "totctl"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
tot-kit = { path = "../tot-kit" }
tot-record = { path = "../tot-record" }
totui = { path = "../totui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
