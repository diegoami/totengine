[package]
name = "totctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for ToTEngine: inspect ToT game data (successor of the Python probe)"

[[bin]]
name = "totctl"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
tot-kit = { path = "../tot-kit" }
totui = { path = "../totui" }
# JSON-RPC framing for `totctl mcp`; already in the workspace tree with
# notices recorded in docs/third-party/ (MIT).
serde_json = "1"
